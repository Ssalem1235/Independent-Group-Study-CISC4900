<!DOCTYPE html>

<head>

  <style>
    body {
      margin: 10;
      background-color: rgb(46, 109, 164);
    }
    .title {
            color: rgb(20, 52, 110);
            font-size: 30px;

      .pollinfo {
            background-color: rgb(200, 173, 122);
            max-width: 900px;

    .pollcontainer {

    .questionbox{
      margin-bottom: 2rem;

    }
    .options {
      gap: 8px;
      display: flex;
      flex-direction: column;
    }
    .optionbuttons {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px;

      background: rgb(232,217, 187);
      cursor: pointer;
      font-size: 13px;
      color: rgb(255, 0, 0);
      width: 100%;
    }
    .optionbuttons.selected {
      background: rgb(42, 32, 22);
      color: white;

    .errortext{
      font-size: 13px;
      color: rgb(210, 4, 45);

      margin-top: 1rem;
